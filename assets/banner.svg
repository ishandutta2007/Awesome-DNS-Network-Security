<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .title-text {
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- 1. Deep Base Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" />

  <!-- 2. Subtle Animated Grid Lines in Background -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- 3. Ambient Glowing Cyber Orbs (Behind Foreground) -->
  <g opacity="0.45" filter="url(#softGlow)">
    <circle cx="200" cy="100" r="85" fill="#0284c7">
      <animate attributeName="cx" values="180;230;180" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;130;90" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="280" r="95" fill="#4f46e5">
      <animate attributeName="cx" values="1020;970;1020" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;240;280" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="80" r="75" fill="#059669">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 4. Dynamic Network Connection Nodes & Packets (Background Decorative) -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4">
    <!-- Network flow path 1 -->
    <path id="flow1" d="M 60,190 Q 280,60 520,130 T 960,100 T 1140,220" fill="none" />
    <!-- Network flow path 2 -->
    <path id="flow2" d="M 80,310 Q 350,350 620,290 T 1120,320" fill="none" stroke="#818cf8" />
  </g>

  <!-- Flowing Network Packets Along Path (Dynamic Aspect) -->
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#flow1"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="8s" begin="2s" repeatCount="indefinite">
      <mpath href="#flow1"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#a855f7" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite">
      <mpath href="#flow2"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="9s" begin="3s" repeatCount="indefinite">
      <mpath href="#flow2"/>
    </animateMotion>
  </circle>

  <!-- 5. Pulsing Target Defense Rings in Corner -->
  <g transform="translate(1080, 75)" opacity="0.4">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#34d399" stroke-width="1.2">
      <animate attributeName="r" values="25;32;25" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
  </g>

  <!-- 6. FOREGROUND PROTECTIVE GLASS CARD (Guarantees Title & Subtitle Never Occluded) -->
  <rect x="70" y="45" width="1060" height="290" rx="14" fill="url(#cardBg)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Accent Top Border Glow on Card -->
  <rect x="120" y="45" width="400" height="2" fill="#38bdf8" opacity="0.8">
    <animate attributeName="x" values="120;680;120" dur="10s" repeatCount="indefinite" />
  </rect>

  <!-- 7. FOREGROUND CONTENT: BRANDING & HEADLINE -->
  <!-- Security Shield & Lock Icon -->
  <g transform="translate(115, 80)">
    <circle cx="36" cy="36" r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    <!-- Shield Path -->
    <path d="M 36,18 L 52,24 C 52,38 45,50 36,54 C 27,50 20,38 20,24 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Center Lock/Check Keyhole -->
    <circle cx="36" cy="33" r="3" fill="#38bdf8" />
    <line x1="36" y1="36" x2="36" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Pulsing ring around shield -->
    <circle cx="36" cy="36" r="42" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="36;46;36" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Category Pre-Header -->
  <g transform="translate(205, 88)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="90" y="15" text-anchor="middle" class="font-sans" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">CURATED DIRECTORY</text>
  </g>

  <!-- Main Headline Title (Crisp Foreground Gradient Text) -->
  <text x="205" y="146" class="font-sans title-text" fill="url(#titleGradient)">Awesome DNS &amp; Network Security</text>

  <!-- Subtitle (Clear, readable, high contrast) -->
  <text x="205" y="184" class="font-sans subtitle-text">
    High-Performance DNS Filtering • Secure Web Gateways (SWG) • Encrypted Resolvers • Zero Trust Network Access
  </text>

  <!-- 8. FOREGROUND DYNAMIC PILLS / HIGHLIGHT CHIPS -->
  <g transform="translate(115, 230)">
    <!-- Pill 1: DNS Filtering -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="5" fill="#38bdf8" />
      <text x="35" y="24" class="font-sans badge-text">DNS Sinkholing</text>
    </g>

    <!-- Pill 2: Encrypted Protocols -->
    <g transform="translate(195, 0)">
      <rect width="210" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="5" fill="#a855f7" />
      <text x="35" y="24" class="font-sans badge-text">DoH / DoT / DoQ / ODoH</text>
    </g>

    <!-- Pill 3: Zero Trust Access -->
    <g transform="translate(420, 0)">
      <rect width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="5" fill="#10b981" />
      <text x="35" y="24" class="font-sans badge-text">Zero Trust &amp; ZTNA</text>
    </g>

    <!-- Pill 4: Secure Web Gateway -->
    <g transform="translate(625, 0)">
      <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="5" fill="#f59e0b" />
      <text x="35" y="24" class="font-sans badge-text">Cloud SWG &amp; SASE</text>
    </g>

    <!-- Pill 5: Open Source & Self-Hosted -->
    <g transform="translate(810, 0)">
      <rect width="160" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="5" fill="#ec4899" />
      <text x="35" y="24" class="font-sans badge-text">100% Self-Hosted</text>
    </g>
  </g>

  <!-- Outer Banner Border Accent -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
